<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Fish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="offline-warning">You're offline!</div>

  <div class="start-screen" id="startScreen">
    <h1>🐟 Flappy Fish</h1>
    <p>Help the fish swim through the pipes!<br>Tap or press space to swim!</p>
    <img src="image/fish.png" alt="Fish" class="fish-icon">
    <button onclick="startGame()">Start Game</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="score">Score: 0</div>

  <div class="game-over" id="gameOverScreen">
    <h2>Fish 🐟 Over</h2>
    <p>Your Score: <span id="finalScore">0</span></p>
    <button onclick="restartGame()">Restart</button>
  </div>

  <audio id="bgMusic" loop src="audio/bgmusic.mp3"></audio>
  <audio id="flapSound" src="audio/swim.mp3"></audio>
  <audio id="hitSound" src="audio/hit.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
